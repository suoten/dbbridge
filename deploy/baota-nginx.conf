# ============================================================================
#  DBBridge 宝塔面板 Nginx 反向代理配置
# ============================================================================
#
# 使用方法：
#   1. 宝塔面板 → 网站 → 添加站点 → 输入域名（如 db.example.com）
#   2. 站点创建后 → 设置 → 配置文件
#   3. 用以下配置替换 server { } 块中的内容（保留你的域名和根目录路径）
#   4. 保存 → 重启 Nginx
#
# 或使用自动配置脚本：
#   bash baota-proxy.sh
#
# ============================================================================

# DBBridge 后端服务地址（本地运行的服务端口）
upstream dbbridge_backend {
    server 127.0.0.1:8989;
    # 如果有多个实例可以在这里加：
    # server 127.0.0.1:8990;
    # 保持连接（WebSocket / 长连接）
    keepalive 32;
}

server {
    # 监听端口
    listen 80;
    # 如果有 SSL 证书，取消下面一行注释
    # listen 443 ssl http2;

    # 站点域名（替换为你的实际域名）
    server_name db.example.com;

    # 站点根目录（宝塔默认会创建，保留即可）
    root /www/wwwroot/db.example.com;

    # SSL 证书配置（如有）
    # ssl_certificate     /www/server/ssl/db.example.com/fullchain.pem;
    # ssl_certificate_key /www/server/ssl/db.example.com/privkey.pem;

    # ====== 安全相关 ======
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # ====== DBBridge 反向代理 ======
    # 核心：将所有请求代理到 DBBridge 后端
    location / {
        proxy_pass http://dbbridge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ====== WebSocket 支持（迁移进度实时推送）======
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ====== 超时设置（大表迁移可能耗时较长）======
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # ====== 缓冲设置 ======
        proxy_buffering off;
        proxy_cache off;
    }

    # ====== 静态资源缓存（如果 DBBridge 前端有独立静态资源）======
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://dbbridge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ====== 健康检查端点 ======
    location = /health {
        proxy_pass http://dbbridge_backend/health;
        access_log off;
    }

    # ====== 访问日志 ======
    access_log /www/wwwlogs/db.example.com.log;
    error_log  /www/wwwlogs/db.example.com.error.log;
}
