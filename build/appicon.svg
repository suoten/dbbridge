<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 主渐变：蓝 -> 紫（135度对角线）-->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- 顶部高光渐变 -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 数据库渐变（白色 -> 半透明白）-->
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- 数据库高光 -->
    <radialGradient id="dbHighlight" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- 阴影滤镜 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 圆角矩形剪裁 -->
    <clipPath id="roundedClip">
      <rect width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- 背景渐变（圆角矩形）-->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bgGrad)"/>

  <!-- 顶部高光 -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#glossGrad)"/>

  <!-- 内边框（微妙的白色边框增加精致感）-->
  <rect x="3" y="3" width="1018" height="1018" rx="226" ry="226"
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>

  <!-- ============ 两个数据库圆柱 ============ -->
  <!-- 左数据库 -->
  <g filter="url(#softShadow)">
    <!-- 侧面 -->
    <rect x="295" y="360" width="200" height="260" fill="url(#dbGrad)" opacity="0.9"/>
    <!-- 底部半椭圆 -->
    <path d="M 295,620 L 295,648 A 100,28 0 0,0 495,648 L 495,620 Z" fill="#ffffff" opacity="0.75"/>
    <!-- 顶部椭圆 -->
    <ellipse cx="395" cy="360" rx="100" ry="28" fill="#ffffff"/>
    <!-- 顶部高光 -->
    <ellipse cx="395" cy="360" rx="82" ry="18" fill="url(#dbHighlight)"/>
    <!-- 分层弧线1 -->
    <path d="M 295,447 A 100,28 0 0,0 495,447" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35"/>
    <!-- 分层弧线2 -->
    <path d="M 295,534 A 100,28 0 0,0 495,534" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.35"/>
  </g>

  <!-- 右数据库 -->
  <g filter="url(#softShadow)">
    <!-- 侧面 -->
    <rect x="529" y="360" width="200" height="260" fill="url(#dbGrad)" opacity="0.75"/>
    <!-- 底部半椭圆 -->
    <path d="M 529,620 L 529,648 A 100,28 0 0,0 729,648 L 729,620 Z" fill="#ffffff" opacity="0.6"/>
    <!-- 顶部椭圆 -->
    <ellipse cx="629" cy="360" rx="100" ry="28" fill="#ffffff" opacity="0.85"/>
    <!-- 顶部高光 -->
    <ellipse cx="629" cy="360" rx="82" ry="18" fill="url(#dbHighlight)"/>
    <!-- 分层弧线1 -->
    <path d="M 529,447 A 100,28 0 0,0 729,447" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.3"/>
    <!-- 分层弧线2 -->
    <path d="M 529,534 A 100,28 0 0,0 729,534" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.3"/>
  </g>

  <!-- ============ 连接桥（数据流弧线）============ -->
  <!-- 上弧：左库 -> 右库 -->
  <path d="M 485,345 Q 512,210 539,345"
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- 下弧：左库 -> 右库 -->
  <path d="M 485,660 Q 512,790 539,660"
        fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <!-- 数据流光点（上弧上5个点）-->
  <circle cx="492" cy="318" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="502" cy="278" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="512" cy="256" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="522" cy="278" r="7" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="532" cy="318" r="7" fill="#ffffff" filter="url(#glow)"/>

  <!-- 数据流光点（下弧上3个点，较小）-->
  <circle cx="500" cy="715" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="512" cy="740" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="524" cy="715" r="5" fill="#ffffff" opacity="0.6"/>

  <!-- ============ 底部文字 ============ -->
  <text x="512" y="880" text-anchor="middle"
        font-family="'Segoe UI', 'Microsoft YaHei', sans-serif"
        font-size="72" font-weight="700"
        fill="#ffffff" letter-spacing="2"
        style="text-shadow: 0 2px 8px rgba(0,0,0,0.3);">
    DBBridge
  </text>

  <!-- 副标题 -->
  <text x="512" y="928" text-anchor="middle"
        font-family="'Segoe UI', sans-serif"
        font-size="26" font-weight="400"
        fill="#ffffff" opacity="0.65" letter-spacing="6">
    DATABASE MIGRATION
  </text>
</svg>